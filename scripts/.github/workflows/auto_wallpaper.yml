name: Auto Convert Wallpapers and Update JSON

on:
  push:
    paths:
      - 'raw_images/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Run Wallpaper Processor
        run: python scripts/process_wallpapers.py

      - name: Commit and Push generated WebP and JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wallpapers/ wallpapers.json
          git status
          git diff-index --quiet HEAD || git commit -m "Auto-convert wallpapers to WebP and update JSON [skip ci]"
          git push
